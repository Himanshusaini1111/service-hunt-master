  <title>Service Hunt</title>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  
  <!-- Firebase SDK - Add BEFORE service worker registration -->
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-messaging-compat.js"></script>
  
  <script>
    // Service Worker Registration with better error handling
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          // Unregister any old service workers first
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let registration of registrations) {
            if (registration.active && registration.active.scriptURL.includes('firebase-messaging-sw.js')) {
              console.log('Found existing service worker, keeping it');
            }
          }
          
          // Register new service worker
          const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
          console.log('✅ ServiceWorker registration successful with scope:', registration.scope);
          
          // Check for updates
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            console.log('🔄 New service worker found, updating...');
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'activated') {
                console.log('✅ New service worker activated');
              }
            });
          });
        } catch (err) {
          console.error('❌ ServiceWorker registration failed: ', err);
        }
      });
    } else {
      console.warn('⚠️ Service Worker not supported in this browser');
    }
  </script>

  <!-- jQuery - Use full version instead of slim for better compatibility -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"
    integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0="
    crossorigin="anonymous"></script>

    crossorigin="anonymous"></script>
  
  <!-- Razorpay -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  
  <div id="root"></div>
</body>
